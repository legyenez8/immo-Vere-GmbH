function saveAddForm(form) {
  const fd = new FormData(form);
  const first = String(fd.get('first')).trim(), last = String(fd.get('last')).trim();
  const room = +fd.get('room'), guests = Math.round(+fd.get('guests')), nights = Math.round(+fd.get('nights'));
  const parts = String(fd.get('from')).split('-').map(Number);
  const err = $('#add-err');
  $$('#add-form [aria-invalid]').forEach(x => x.removeAttribute('aria-invalid'));
  const fail = (msg, sel) => { err.textContent = msg; err.hidden = false; const f = $(sel); if (f) { f.setAttribute('aria-invalid', 'true'); f.setAttribute('aria-describedby', 'add-err'); f.focus(); } };
  if (!first || !last) return fail(t('f.err.name'), first ? '#a-last' : '#a-first');
  if (parts.length !== 3 || parts.some(x => !Number.isFinite(x))) return fail(t('f.err.date'), '#a-from');
  const from = offOf(parts[0], parts[1] - 1, parts[2]);
  if (from < 0) return fail(t('f.err.date'), '#a-from');
  if (!(nights >= 1 && nights <= 30)) return fail(t('f.err.nights'), '#a-nights');
  const cap = capOf(ROOMS[room].kind);
  if (!(guests >= 1 && guests <= cap)) return fail(t('f.err.guests', { n: guestsL(cap) }), '#a-guests');
  const to = from + nights;
  if (busy(room, from, to)) return fail(t('f.err.conflict', { room: roomLabel(room) }), '#a-room');
  const rooms = priceRooms([{ room, kind: ROOMS[room].kind, guests }], from, to, 'flex');
  const b = { ref: newRef(), from, to, rate: 'flex', pay: 'onsite', channel: String(fd.get('channel')), status: 'conf', payStatus: 'open',
    guest: { first, last, email: `${ascii(first)}.${ascii(last)}@example.com`, phone: '', company: '' }, guests, rooms,
    sub: sumOf(rooms, 'sub'), long: sumOf(rooms, 'long'), saver: 0, total: sumOf(rooms, 'total'), cond: { freeH: S.rules.freeH }, times: { ...S.times }, arrival: '', notes: '', created: Date.now(), isNew: false, refund: 0 };
  S.bookings.push(b);
  save();
  closeLayer(undefined, false);
  renderSite();
  toast(t('f.saved', { name: `${first} ${last}` }));
  openDrawer(b.ref);
}

    { k: 5, done: p.s5, enabled: !!S.lastNew, need: 2 }
  ];
  $('#presenter').innerHTML = `<button class="pres-close" type="button" data-act="pres-close" aria-label="${esc(t('pres.close'))}">${icon('close')}</button>
    <h2 id="pres-title" tabindex="-1">${t('pres.title')}</h2><p>${t('pres.lead')}</p>
    <ol class="pres-steps">${steps.map(s => `<li class="pres-step ${s.done ? 'is-done' : ''}"><span class="pres-num" aria-hidden="true">${s.done ? icon('check') : s.k}</span><div><b>${t(`pres.${s.k}.t`)}${s.done ? `<span class="sr-only"> (${t('pres.done')})</span>` : ''}</b><p>${t(`pres.${s.k}.d`)}</p>${s.enabled ? `<button class="btn btn-brass" type="button" data-act="pres" data-k="${s.k}">${t(`pres.${s.k}.b`)}${icon('arrow')}</button>` : `<span class="pres-hint">${t('pres.need', { n: s.need })}</span>`}</div></li>`).join('')}</ol>
    <div class="pres-foot"><p>${t('pres.reset.d')}</p><div class="row"><button class="btn btn-ghost btn-sm" type="button" data-act="reset-ask">${icon('reset')}${t('pres.reset')}</button></div></div>`;
}
function presStep(k) {
  togglePresenter(false);
  if (BK.processing || BK.paying) return;
  if (k === 1) {
    if (UI.view === 'admin') hideAdmin(true);
    BK = draft({ from: 3, to: 5, guests: 3, form: { ...BK.form, terms: false } });
    S.pres.s1 = false;
    openBooking(1);
    return;
  }
  if (k === 2) { if (BK.step === 6) { presStep(1); return; } openBooking(Math.max(1, BK.step)); return; }
  if (!S.lastNew) return;
  if (k === 3) {
    if (UI.view === 'admin') hideAdmin(true);
    BK.doneRef = S.lastNew;
    BK.step = 6;
    openBooking(6, { keepDone: true });
    return;
  }
  BK.open = false;
  $('#bk').hidden = true;
  showAdmin();
  openDrawer(S.lastNew);
  if (k === 5 && drawerEntry) { const c = drawerEntry.wrap.querySelector('[data-act="cancel"]') || drawerEntry.wrap.querySelector('[data-act="d-conf"]'); if (c) c.focus(); }
}
function askReset() {
  togglePresenter(false);
  openLayer({
    label: t('reset.h'), focus: '[data-act="reset-no"]',
    html: `<div class="m-body"><h3>${t('reset.h')}</h3><p>${t('reset.t')}</p><div class="m-actions"><button class="btn btn-danger" type="button" data-act="reset-yes">${icon('reset')}${t('reset.yes')}</button><button class="btn btn-line" type="button" data-act="reset-no">${t('reset.no')}</button></div></div>`
  });
}
function resetDemo() {
  cancelProcessing();
  while (layers.length) closeLayer(layers[layers.length - 1], false);
  store.del(LS_STATE);
  defaults();
  save();
  BK = draft();
  UI.ad = { tab: 'plan', start: -2, q: '', st: 'all', pay: 'all', focus: null, pulse: false };
  UI.gal = { EZ: 0, DZ: 0 };
  UI.view = 'site';
  $('#bk').hidden = true;
  $('#ad').hidden = true;
  syncInert();
  setDemoNav();
  renderSite();
  renderPresenter();
  scrollTo({ top: 0, behavior: 'auto' });
  toast(t('reset.done'));
  $('#main').focus({ preventScroll: true });
}
$('#demobar').addEventListener('click', e => {
  const el = e.target.closest('button');
  if (!el) return;
  if (el.id === 'pres-btn') return togglePresenter(!UI.presOpen);
  if (el.dataset.act === 'reset-ask') return askReset();
  if (BK.processing || BK.paying) return;
  if (el.dataset.go === 'admin') return showAdmin();
  if (el.dataset.go === 'site') { togglePresenter(false); if (UI.view === 'admin') hideAdmin(); if (BK.open) closeBooking(); }
});
$('#presenter').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'pres-close') { togglePresenter(false); $('#pres-btn').focus(); return; }
  if (el.dataset.act === 'pres') return presStep(+el.dataset.k);
  if (el.dataset.act === 'reset-ask') return askReset();
});
document.addEventListener('click', e => {
  if (UI.presOpen && !e.target.closest('#presenter') && !e.target.closest('#pres-btn') && !e.target.closest('#layers')) togglePresenter(false);
});

/* =========================================================
   Website-Ereignisse
   ========================================================= */
$('#site-root').addEventListener('click', e => {
  const el = e.target.closest('[data-book], [data-act], [data-legal], [data-lang]');
  if (!el) return;
  if (el.dataset.lang) return setLang(el.dataset.lang);
  if (el.dataset.legal) return legal(el.dataset.legal);
  if (el.dataset.book) return openBooking(+el.dataset.book, { edit: el.dataset.edit || 'from' });
  const a = el.dataset.act;
  if (a === 'sb-guests') { BK.guests = Math.min(12, Math.max(1, BK.guests + +el.dataset.d)); renderSite(); return; }
  if (a === 'gal') { UI.gal[el.dataset.type] = +el.dataset.i; renderSite(); const b = $(`#room-list [data-act="gal"][data-type="${el.dataset.type}"][data-i="${el.dataset.i}"]`); if (b) b.focus(); return; }
  if (a === 'choose') {
    const type = el.dataset.type;
    BK.qty = { EZ: 0, DZD: 0, DZT: 0 };
    if (type === 'EZ') { if (freeRooms('EZ', BK.from, BK.to).length) BK.qty.EZ = 1; if (BK.guests > 1 && BK.qty.EZ) BK.guests = 1; }
    else { const k = freeRooms('DZD', BK.from, BK.to).length ? 'DZD' : freeRooms('DZT', BK.from, BK.to).length ? 'DZT' : null; if (k) BK.qty[k] = 1; }
    if (!roomCount()) { openBooking(1, { edit: 'from' }); return; }
    openBooking(2);
    return;
  }
  if (a === 'copy-mail') {
    const v = $('#mail-value').textContent;
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#mail-value')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t('contact.copyfail')); };
    try { navigator.clipboard.writeText(v).then(() => toast(t('contact.copied')), fallback); } catch (err) { fallback(); }
  }
});
function setLang(l) {
  lang = l;
  store.set(LS_LANG, l);
  applyI18n();
}
$('#menu-btn').addEventListener('click', () => toggleMenu($('#mobile-nav').hidden));
$('#mobile-nav').addEventListener('click', e => { if (e.target.closest('a')) toggleMenu(false); });

/* =========================================================
   Start
   ========================================================= */
load();
save();
applyI18n();
updateClock();
mapCompact = $('#map').getBoundingClientRect().width < 480;
$('#header').classList.toggle('scrolled', scrollY > 30);
setDemoNav();
function deepLink() {
  const h = location.hash.replace('#', '');
  if (h === 'buchen' || h === 'booking') openBooking(1);
  else if (h === 'verwaltung' || h === 'admin') showAdmin();
  else if (h === 'praesentation' || h === 'presentation') togglePresenter(true);
}
deepLink();
addEventListener('hashchange', deepLink);
})();
</script>
