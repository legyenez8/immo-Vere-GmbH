<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Schlafzeit.de</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: "Nacht bis Morgen" – arrival in midnight blue, a dawn band, morning light for breakfast/location/FAQ, back to night for the next booking.
   Type: Cormorant Garamond 500 for large display, 600 for small display sizes, italic 500 for the few gold emphases; Manrope for everything functional. */
:root {
  color-scheme: light;
  --ink: #0A1120;
  --night: #0F1A2E;
  --night-2: #15223A;
  --night-3: #1F2E4A;
  --brass: #C4A46A;
  --brass-soft: #DCC598;
  --brass-deep: #7A5E31;
  --linen: #F5F1E9;
  --paper: #FBF9F5;
  --stone: #E7DFD2;
  --line: #D8CDBC;
  --line-soft: #ECE6DB;
  --text: #19202E;
  --muted: #545C6C;
  --on-dark: #EEE9DF;
  --on-dark-muted: #B0B7C5;
  --on-dark-line: rgba(196, 164, 106, .32);
  --ok: #3B6A4A;
  --ok-bg: #E1ECE3;
  --danger: #9A3F28;
  --danger-bg: #F6E4DD;
  --f-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --gutter: clamp(16px, 4vw, 40px);
  --demo-h: calc(44px + env(safe-area-inset-top, 0px));
  --header-h: 72px;
  --ease: cubic-bezier(.2, .7, .1, 1);
  --fast: .18s;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: calc(var(--demo-h) + var(--header-h)); }
html.lock { overflow: hidden; }
body { margin: 0; padding-top: var(--demo-h); font-family: var(--f-body); font-size: 1rem; line-height: 1.6; color: var(--text); background: var(--ink); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
.on-light :focus-visible, .bk :focus-visible, .ad :focus-visible, .layer :focus-visible { outline-color: var(--brass-deep); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: fixed; left: 12px; top: -120px; z-index: 300; background: var(--brass); color: var(--ink); padding: 10px 16px; font-weight: 700; }
.skip:focus { top: calc(var(--demo-h) + 8px); }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: var(--gutter); }
.icon { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* Type */
.eyebrow { font: 700 .78rem/1.2 var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--brass); margin: 0 0 18px; display: flex; align-items: center; gap: 12px; }
.eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; opacity: .7; }
.on-light .eyebrow { color: var(--brass-deep); }
.display { font-family: var(--f-display); font-weight: 500; line-height: 1; letter-spacing: -.005em; margin: 0; text-wrap: balance; }
.display em { font-style: italic; font-weight: 500; color: var(--brass); }
.on-light .display em, .bk .display em { color: var(--brass-deep); }
h2.display { font-size: clamp(2.3rem, 4.4vw, 3.8rem); }
.lead { font-size: clamp(1.02rem, 1.3vw, 1.12rem); line-height: 1.7; max-width: 58ch; margin: 20px 0 0; }
.on-dark { color: var(--on-dark); }
.on-dark .lead { color: var(--on-dark-muted); }
.on-light .lead { color: var(--muted); }
.serif-sm { font-family: var(--f-display); font-weight: 600; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; border: 1px solid transparent; border-radius: 2px; font: 700 .84rem/1.1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; text-decoration: none; transition: background var(--fast), color var(--fast), border-color var(--fast); text-align: center; }
.btn-brass { background: var(--brass); color: var(--ink); }
.btn-brass:hover { background: var(--brass-soft); }
.btn-ink { background: var(--night); color: var(--on-dark); }
.btn-ink:hover { background: var(--night-3); }
.btn-ghost { background: transparent; border-color: var(--on-dark-line); color: var(--on-dark); }
.btn-ghost:hover { border-color: var(--brass); color: var(--brass-soft); }
.btn-line { background: var(--paper); border-color: var(--line); color: var(--text); }
.btn-line:hover { border-color: var(--brass-deep); color: var(--brass-deep); }
.btn-danger { background: var(--paper); border-color: #DDB8AA; color: var(--danger); }
.btn-danger:hover { background: var(--danger-bg); }
.btn .icon { width: 1.1em; height: 1.1em; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn-sm { min-height: 44px; padding: 0 14px; font-size: .78rem; }
.link-btn { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--brass-deep); }
.demo-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px dashed currentColor; border-radius: 999px; font: 700 .72rem/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--brass-deep); white-space: nowrap; }
.on-dark .demo-pill, .demo-pill.on-ink { color: var(--brass); }
.todo { display: inline-block; padding: 1px 8px; border: 1px dashed currentColor; border-radius: 3px; font: 700 .72rem/1.6 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--brass-deep); vertical-align: middle; }
.on-dark .todo { color: var(--brass); }

/* Demo bar (owner controls, always on top) */
.demobar { position: fixed; top: 0; left: 0; right: 0; z-index: 140; height: var(--demo-h); padding-top: env(safe-area-inset-top, 0px); background: #070C17; color: var(--on-dark-muted); border-bottom: 1px solid rgba(196,164,106,.25); font-size: .82rem; }
.demobar .wrap { max-width: none; height: 44px; display: flex; align-items: center; gap: 14px; }
.demo-badge { background: var(--brass); color: var(--ink); font: 800 .7rem/1 var(--f-body); letter-spacing: .14em; padding: 5px 9px; border-radius: 3px; flex: none; }
.demobar .note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.demobar nav { display: flex; gap: 4px; margin-left: auto; flex: none; }
.demobar nav button { position: relative; background: none; border: 1px solid transparent; color: var(--on-dark); min-height: 36px; padding: 0 11px; border-radius: 999px; font-size: .8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.demobar nav button:hover { border-color: var(--on-dark-line); }
.demobar nav button::after, .lang button::after { content: ""; position: absolute; inset: -4px 0; }
.demobar nav button[aria-pressed="true"], .demobar nav button[aria-expanded="true"] { background: rgba(196,164,106,.16); border-color: rgba(196,164,106,.45); color: var(--brass-soft); }
.demobar nav .icon { width: 15px; height: 15px; }
.presenter { position: fixed; z-index: 150; top: calc(var(--demo-h) + 8px); right: 12px; width: min(420px, calc(100vw - 24px)); max-height: calc(100vh - var(--demo-h) - 20px); max-height: calc(100dvh - var(--demo-h) - 20px); overflow-y: auto; overscroll-behavior: contain; background: #0D1626; color: var(--on-dark); border: 1px solid rgba(196,164,106,.35); box-shadow: 0 24px 60px rgba(0,0,0,.45); padding: 20px; animation: pop var(--fast) var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.presenter h2 { font: 600 1.5rem/1.1 var(--f-display); margin: 0; outline: none; }
.presenter > p { margin: 6px 0 16px; color: var(--on-dark-muted); font-size: .88rem; }
.pres-close { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--on-dark-line); background: none; color: var(--on-dark); display: inline-flex; align-items: center; justify-content: center; }
.pres-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.pres-step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid rgba(196,164,106,.16); }
.pres-num { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--on-dark-line); display: grid; place-items: center; font-weight: 700; font-size: .8rem; color: var(--brass-soft); }
.pres-num .icon { width: 14px; height: 14px; stroke-width: 2.4; }
.pres-step.is-done .pres-num { background: var(--brass); border-color: var(--brass); color: var(--ink); }
.pres-step b { display: block; font-size: .95rem; }
.pres-step p { margin: 3px 0 10px; color: var(--on-dark-muted); font-size: .84rem; line-height: 1.5; }
.pres-step .btn { min-height: 44px; font-size: .74rem; padding: 0 14px; }
.pres-hint { font-size: .8rem; color: var(--on-dark-muted); }
.pres-foot { margin-top: 12px; padding-top: 14px; border-top: 1px solid rgba(196,164,106,.16); display: grid; gap: 10px; }
.pres-foot p { margin: 0; font-size: .86rem; color: var(--on-dark-muted); }
.pres-foot .row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Header */
.site-header { position: sticky; top: var(--demo-h); z-index: 60; height: var(--header-h); margin-bottom: calc(var(--header-h) * -1); color: var(--on-dark); transition: background .3s, box-shadow .3s; }
.site-header.scrolled { background: rgba(10, 17, 32, .92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 1px 0 rgba(196,164,106,.18); }
.site-header .wrap { height: 100%; display: flex; align-items: center; gap: 24px; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.logo-mark { width: 30px; height: 30px; color: var(--brass); flex: none; }
.logo-text { display: grid; line-height: 1; text-align: left; }
.logo-text b { font: 600 1.55rem/1 var(--f-display); }
.logo-text b span { color: var(--brass); font-weight: 500; font-size: .7em; }
.logo-text small { font: 700 .62rem/1 var(--f-body); letter-spacing: .22em; text-transform: uppercase; color: var(--on-dark-muted); margin-top: 6px; }
.main-nav { display: flex; gap: 24px; margin-left: auto; }
.main-nav a { text-decoration: none; font-size: .9rem; font-weight: 500; color: var(--on-dark); opacity: .88; position: relative; padding-block: 8px; }
.main-nav a:hover { opacity: 1; }
.main-nav a::after { content: ""; position: absolute; left: 0; right: 100%; bottom: 2px; height: 1px; background: var(--brass); transition: right .25s var(--ease); }
.main-nav a:hover::after { right: 0; }
.header-tools { display: flex; align-items: center; gap: 12px; }
.clock { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border: 1px solid var(--on-dark-line); border-radius: 999px; font: 600 .82rem/1 var(--f-body); font-variant-numeric: tabular-nums; color: var(--brass-soft); min-width: 88px; justify-content: center; }
.clock .icon { width: 15px; height: 15px; }
.lang { display: inline-flex; border: 1px solid var(--on-dark-line); border-radius: 999px; padding: 2px; }
.lang button { position: relative; background: none; border: 0; min-width: 44px; min-height: 36px; padding: 0 8px; border-radius: 999px; font-size: .78rem; font-weight: 700; letter-spacing: .06em; color: var(--on-dark-muted); }
.lang button[aria-pressed="true"] { background: var(--brass); color: var(--ink); }
.header-book { min-height: 44px; }
.menu-btn { display: none; background: none; border: 1px solid var(--on-dark-line); color: var(--on-dark); width: 44px; height: 44px; border-radius: 2px; align-items: center; justify-content: center; }
.mobile-nav { position: absolute; left: 0; right: 0; top: var(--header-h); background: rgba(10,17,32,.98); border-top: 1px solid var(--on-dark-line); padding: 8px var(--gutter) 20px; display: grid; }
.mobile-nav a { padding: 12px 0; border-bottom: 1px solid rgba(196,164,106,.12); text-decoration: none; font: 500 1.5rem/1.2 var(--f-display); }

/* Hero */
.hero { position: relative; background: var(--ink); overflow: hidden; }
.hero-media { position: absolute; inset: 0; overflow: hidden; }
.hero-media img { width: 100%; height: 100%; object-fit: cover; object-position: 62% 46%; animation: drift 9s var(--ease) both; }
.hero-media::after { content: ""; position: absolute; inset: 0; background:
  linear-gradient(90deg, rgba(10,17,32,.97) 0%, rgba(10,17,32,.88) 30%, rgba(10,17,32,.4) 60%, rgba(10,17,32,.12) 100%),
  linear-gradient(0deg, rgba(10,17,32,.96) 0%, rgba(10,17,32,0) 40%); }
@keyframes drift { from { transform: scale(1.04); } to { transform: none; } }
.hero-inner { position: relative; display: grid; align-content: end; min-height: clamp(620px, calc(100vh - var(--demo-h)), 860px); padding-block: calc(var(--header-h) + 40px) 40px; }
.hero h1 { font-size: clamp(3.2rem, 8vw, 6.8rem); line-height: .92; color: #F7F2E8; }
.hero h1 .line { display: block; animation: rise .55s var(--ease) both; }
.hero h1 .line:nth-child(2) { animation-delay: .06s; }
.hero h1 .line:nth-child(3) { animation-delay: .12s; }
@keyframes rise { from { transform: translateY(10px); opacity: .001; } to { transform: none; opacity: 1; } }
.hero .lead { color: #CDD1DA; max-width: 46ch; }
.searchbar { margin-top: 34px; display: grid; grid-template-columns: 1fr 1fr .9fr auto; background: rgba(15, 26, 46, .8); border: 1px solid rgba(196,164,106,.4); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); max-width: 960px; }
.sb-field { background: none; border: 0; border-right: 1px solid rgba(196,164,106,.22); text-align: left; padding: 14px 20px; color: var(--on-dark); display: grid; gap: 4px; min-width: 0; min-height: 76px; align-content: center; }
button.sb-field:hover { background: rgba(196,164,106,.08); }
.sb-label { font: 700 .72rem/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
.sb-value { font: 600 1.3rem/1.15 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: lining-nums; }
.sb-guests { display: flex; align-items: center; gap: 10px; }
.sb-guests button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--on-dark-line); background: none; color: var(--on-dark); display: inline-flex; align-items: center; justify-content: center; }
.sb-guests button:hover:not(:disabled) { border-color: var(--brass); }
.sb-guests button:disabled { opacity: .35; cursor: default; }
.sb-guests .icon { width: 14px; height: 14px; }
.searchbar > .btn { min-height: 100%; padding: 0 28px; border-radius: 0; font-size: .86rem; }
.hero-sub { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 16px; font-size: .88rem; color: var(--on-dark-muted); }
.hero-sub span { display: inline-flex; align-items: center; gap: 8px; }
.hero-sub .icon { color: var(--brass); width: 16px; height: 16px; }
.hero-sub b { color: var(--on-dark); font-weight: 600; }

/* Facts */
.facts { background: var(--ink); color: var(--on-dark); border-top: 1px solid rgba(196,164,106,.16); }
.facts-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.fact { display: flex; gap: 16px; align-items: flex-start; padding: 28px 24px; border-left: 1px solid rgba(196,164,106,.16); }
.fact:first-child { border-left: 0; padding-left: 0; }
.fact > div { min-width: 0; }
.fact .icon { width: 28px; height: 28px; color: var(--brass); stroke-width: 1.3; }
.fact b { display: block; font: 600 1.3rem/1.15 var(--f-display); overflow-wrap: break-word; hyphens: manual; }
.fact small { color: var(--on-dark-muted); font-size: .88rem; }

/* Rooms */
.rooms { background: var(--night); padding-block: clamp(76px, 10vw, 140px) clamp(76px, 9vw, 120px); }
.section-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 64px; align-items: end; margin-bottom: clamp(32px, 4vw, 48px); }
.section-head .lead { margin: 0; }
.period { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 14px 18px; border: 1px solid rgba(196,164,106,.24); background: rgba(10,17,32,.4); margin-bottom: clamp(40px, 5vw, 64px); }
.period .icon { color: var(--brass); }
.period span { color: var(--on-dark-muted); font-size: .9rem; }
.period strong { font: 600 1.15rem/1.2 var(--f-display); color: var(--on-dark); }
.period .btn { margin-left: auto; }
.room-list { display: grid; gap: clamp(64px, 8vw, 104px); }
.room-row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
.room-row.flip { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
.room-row.flip .gallery { order: 2; }
.gallery-main { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--night-2); max-width: 100%; }
.gallery-main img { width: 100%; height: 100%; object-fit: cover; }
.gallery-main::after { content: ""; position: absolute; inset: 12px; border: 1px solid rgba(220,197,152,.32); pointer-events: none; }
.thumbs { display: flex; gap: 8px; margin-top: 10px; }
.thumbs button { flex: 1; max-width: 120px; aspect-ratio: 4 / 3; padding: 0; border: 2px solid transparent; background: none; overflow: hidden; opacity: .6; transition: opacity var(--fast); }
.thumbs button:hover { opacity: .9; }
.thumbs button[aria-pressed="true"] { border-color: var(--brass); opacity: 1; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.avail { position: absolute; left: 24px; bottom: 24px; z-index: 1; display: inline-flex; align-items: center; gap: 9px; padding: 9px 14px; background: rgba(10,17,32,.86); color: var(--on-dark); font-size: .84rem; font-weight: 600; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); max-width: calc(100% - 48px); }
.avail i { width: 8px; height: 8px; border-radius: 50%; background: #86B894; flex: none; }
.avail.low i { background: var(--brass); }
.avail.none i { background: #C4674E; }
.room-count { font: 700 .76rem/1 var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--brass); }
.room-name { font: 500 clamp(2.4rem, 4vw, 3.4rem)/1 var(--f-display); margin: 12px 0 0; color: #F7F2E8; }
.room-copy > p { color: var(--on-dark-muted); max-width: 46ch; margin: 16px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid rgba(196,164,106,.26); border-radius: 999px; font-size: .84rem; color: var(--on-dark); }
.chip .icon { width: 16px; height: 16px; color: var(--brass); }
.price-block { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-top: 26px; padding-top: 22px; border-top: 1px solid rgba(196,164,106,.2); }
.price-main { display: grid; gap: 2px; }
.price-main .from { font-size: .86rem; color: var(--on-dark-muted); }
.price-main b { font: 600 2.6rem/1 var(--f-display); color: #F7F2E8; }
.price-main small { font-size: .86rem; color: var(--on-dark-muted); }
.price-stay { font-size: .9rem; color: var(--on-dark-muted); }
.price-stay b { color: var(--on-dark); font-weight: 600; }

/* Audience */
.audience { background: var(--night-2); padding-block: clamp(76px, 9vw, 120px); }
.aud-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: rgba(196,164,106,.16); border: 1px solid rgba(196,164,106,.16); }
.aud { background: var(--night-2); padding: 30px 26px 34px; display: grid; gap: 12px; align-content: start; }
.aud .icon { width: 32px; height: 32px; color: var(--brass); stroke-width: 1.2; }
.aud b { font: 600 1.5rem/1.15 var(--f-display); color: #F7F2E8; }
.aud p { margin: 0; color: var(--on-dark-muted); font-size: .94rem; }

/* Dawn */
.dawn { position: relative; overflow: hidden; text-align: center; padding-block: clamp(100px, 13vw, 180px) clamp(120px, 15vw, 210px);
  background: linear-gradient(180deg, var(--night-2) 0%, #26324D 26%, #4A4F66 46%, #8F8580 64%, #D1BFA2 82%, var(--linen) 100%); color: var(--on-dark); }
.dawn::before { content: ""; position: absolute; left: 50%; bottom: -46vw; width: 92vw; height: 92vw; max-width: 1300px; max-height: 1300px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,226,170,.55) 0%, rgba(240,196,130,.22) 30%, rgba(240,196,130,0) 62%); pointer-events: none; }
.dawn .wrap { position: relative; }
.dawn h2 { font-size: clamp(2.6rem, 6vw, 5.2rem); color: #F7F1E6; }
.dawn h2 em { color: #F3D9A6; }
.dawn p { color: #ECE4D6; max-width: 54ch; margin: 24px auto 0; font-size: 1.06rem; }
.dawn-times { display: flex; justify-content: center; gap: 18px; margin-top: 32px; font: 700 .78rem/1 var(--f-body); letter-spacing: .2em; color: #F3E3C4; }
.dawn-times span { display: inline-flex; align-items: center; gap: 8px; }
.dawn-times .icon { width: 16px; height: 16px; }
.dawn-times hr { width: 80px; border: 0; border-top: 1px dashed rgba(243,227,196,.6); margin: auto 0; }

/* Morning */
.morning { background: var(--linen); color: var(--text); padding-block: clamp(36px, 5vw, 70px) clamp(76px, 9vw, 130px); }
.morning-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(32px, 6vw, 90px); align-items: center; }
.collage { display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px; }
.collage figure { margin: 0; overflow: hidden; background: var(--stone); }
.collage img { width: 100%; height: 100%; object-fit: cover; }
.collage .c1 { grid-row: span 2; aspect-ratio: 3 / 4.1; }
.collage .c2, .collage .c3 { aspect-ratio: 4 / 3; }
.collage .c2 img { object-position: 50% 60%; }
.beck-tag { display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; padding: 10px 16px; border: 1px solid var(--line); background: var(--paper); font-size: .9rem; font-weight: 600; }
.beck-tag .icon { color: var(--brass-deep); }
.drinks { margin-top: 28px; display: flex; gap: 16px; align-items: flex-start; padding-top: 24px; border-top: 1px solid var(--line); }
.drinks .icon { width: 28px; height: 28px; color: var(--brass-deep); stroke-width: 1.3; }
.drinks b { display: block; font: 600 1.35rem/1.15 var(--f-display); }
.drinks p { margin: 4px 0 0; color: var(--muted); font-size: .94rem; }

/* Location */
.location { background: var(--paper); color: var(--text); padding-block: clamp(76px, 9vw, 130px); }
.loc-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: clamp(32px, 6vw, 80px); align-items: start; }
.dist { list-style: none; padding: 0; margin: 30px 0 0; border-top: 1px solid var(--line); }
.dist li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: .96rem; }
.dist .icon { color: var(--brass-deep); width: 20px; height: 20px; }
.dist em { font-style: normal; color: var(--muted); font-size: .9rem; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dist em b { color: var(--text); font-weight: 700; }
.loc-note { font-size: .84rem; color: var(--muted); margin: 12px 0 0; }
.address-card { margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.address-card address { font-style: normal; line-height: 1.5; }
.address-card address b { font: 600 1.3rem/1.2 var(--f-display); display: block; }
.map { margin: 0; background: var(--night); color: var(--on-dark); position: relative; aspect-ratio: 56 / 50; max-width: 100%; overflow: hidden; }
.map svg { width: 100%; height: 100%; display: block; }
.map figcaption { position: absolute; left: 16px; bottom: 12px; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--on-dark-muted); }
@keyframes pulse { 0% { r: 9; opacity: .8; } 100% { r: 28; opacity: 0; } }
.map .pulse { animation: pulse 2.6s ease-out infinite; }

/* FAQ */
.faq { background: var(--linen); color: var(--text); padding-block: clamp(76px, 9vw, 120px); }
.faq-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: clamp(32px, 6vw, 90px); align-items: start; }
.faq-list { border-top: 1px solid var(--line); }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 20px 0; font: 600 1.32rem/1.25 var(--f-display); min-height: 44px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary .icon { color: var(--brass-deep); transition: transform var(--fast) var(--ease); }
.faq details[open] summary .icon { transform: rotate(45deg); }
.faq details p { margin: 0 0 22px; color: var(--muted); max-width: 62ch; }

/* Contact */
.contact { background: var(--night); color: var(--on-dark); position: relative; overflow: hidden; }
.contact-grid { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 540px; }
.contact-copy { padding-block: clamp(76px, 9vw, 120px); max-width: min(640px, 54%); display: grid; align-content: center; position: relative; z-index: 2; }
.contact-copy h2 { font-size: clamp(2.5rem, 5vw, 4.4rem); color: #F7F2E8; }
.contact-media { position: absolute; top: 0; right: 0; bottom: 0; width: min(46vw, 760px); }
.contact-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.contact-media::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, var(--night) 0%, rgba(15,26,46,.2) 40%, rgba(15,26,46,0)); }
.contact-lines { display: grid; gap: 12px; margin-top: 30px; }
.contact-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.contact-line .label { font: 700 .72rem/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--brass); width: 82px; }
.contact-line .value { font: 600 1.3rem/1.2 var(--f-display); user-select: all; }
.copy-btn { background: none; border: 1px solid var(--on-dark-line); color: var(--on-dark-muted); font-size: .78rem; min-height: 44px; padding: 0 12px; border-radius: 999px; }
.copy-btn:hover { color: var(--brass-soft); border-color: var(--brass); }

/* Footer */
.site-footer { background: var(--ink); color: var(--on-dark-muted); font-size: .9rem; padding-block: 52px calc(36px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid rgba(196,164,106,.14); }
.footer-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; }
.site-footer .logo { color: var(--on-dark); }
.site-footer p { margin: 14px 0 0; }
.footer-links { display: flex; flex-wrap: wrap; gap: 4px 20px; align-content: start; justify-content: flex-end; }
.footer-links button { background: none; border: 0; padding: 8px 0; text-align: left; color: var(--on-dark); font-size: .92rem; min-height: 44px; min-width: 44px; }
.footer-links button:hover { color: var(--brass-soft); }
.footer-bottom { margin-top: 36px; padding-top: 20px; border-top: 1px solid rgba(196,164,106,.12); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: .82rem; }

/* Mobile CTA */
.mcta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 55; background: rgba(10,17,32,.97); border-top: 1px solid rgba(196,164,106,.3); padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom, 0px)); display: none; align-items: center; justify-content: space-between; gap: 12px; color: var(--on-dark); transform: translateY(110%); visibility: hidden; transition: transform .25s var(--ease), visibility .25s; }
.mcta.show { transform: none; visibility: visible; }
.mcta b { font: 600 1.3rem/1 var(--f-display); }
.mcta small { display: block; color: var(--on-dark-muted); font-size: .78rem; margin-top: 3px; }

/* Layers: modal, drawer */
.layer { position: fixed; inset: 0; z-index: 160; display: grid; }
.layer-backdrop { position: absolute; inset: 0; background: rgba(6, 10, 20, .66); animation: fade var(--fast) both; }
@keyframes fade { from { opacity: 0; } }
.layer-modal { place-items: center; padding: 20px var(--gutter); overflow-y: auto; overscroll-behavior: contain; }
.layer-card { position: relative; background: var(--paper); color: var(--text); box-shadow: 0 30px 80px rgba(0,0,0,.4); outline: none; }
.layer-modal .layer-card { width: min(560px, 100%); max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); overflow-y: auto; overscroll-behavior: contain; animation: pop var(--fast) var(--ease) both; }
.layer-modal .layer-card.wide { width: min(780px, 100%); }
/* The single grid row must not grow with the drawer's content, otherwise the drawer gets taller than the screen and nothing scrolls. */
.layer-drawer { justify-items: end; grid-template-rows: minmax(0, 1fr); }
.layer-drawer .layer-card { width: min(460px, 100%); height: 100%; min-height: 0; display: flex; flex-direction: column; animation: slidein .22s var(--ease); }
/* no fill-mode on purpose: a lingering transform would pin the fixed close button (phones) to the card */
@keyframes slidein { from { transform: translateX(24px); opacity: .001; } to { transform: none; opacity: 1; } }
.x-btn { position: absolute; top: 12px; right: 12px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(251,249,245,.92); color: var(--text); display: inline-flex; align-items: center; justify-content: center; }
.x-btn:hover { background: var(--stone); }
/* Long dialogs scroll inside the card; keep the close button in reach. */
.layer-modal .x-btn { position: sticky; top: 12px; display: flex; margin: 12px 12px -56px auto; box-shadow: 0 2px 10px rgba(15,26,46,.12); }
.m-body { padding: clamp(24px, 4vw, 40px); }
.m-body h3 { font: 600 clamp(1.7rem, 3.4vw, 2.3rem)/1.1 var(--f-display); margin: 0; padding-right: 40px; }
.m-body h4 { font: 700 .74rem/1.2 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--brass-deep); margin: 24px 0 8px; }
.m-body p { margin: 8px 0 0; color: var(--muted); }
.m-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.legal p { color: var(--text); margin: 3px 0 0; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 200; transform: translate(-50%, 140%); visibility: hidden; background: var(--night); color: var(--on-dark); border: 1px solid rgba(196,164,106,.45); padding: 10px 12px 10px 16px; font-size: .9rem; display: flex; align-items: center; gap: 12px; transition: transform .22s var(--ease), visibility .22s; width: max-content; max-width: calc(100vw - 32px); box-shadow: 0 14px 40px rgba(0,0,0,.35); }
.toast.show { transform: translate(-50%, 0); visibility: visible; }
.toast > .icon { color: var(--brass); }
.toast button { background: none; border: 1px solid var(--on-dark-line); color: var(--brass-soft); min-height: 44px; padding: 0 12px; font-size: .8rem; font-weight: 700; white-space: nowrap; }

/* ============ Booking ============ */
.bk { position: fixed; top: var(--demo-h); left: 0; right: 0; bottom: 0; z-index: 100; background: var(--linen); color: var(--text); display: flex; flex-direction: column; }
.bk-top { background: var(--ink); color: var(--on-dark); flex: none; }
.bk-top .wrap { display: flex; align-items: center; gap: 20px; min-height: 66px; }
.bk-steps { display: flex; gap: 2px; list-style: none; margin: 0 auto; padding: 0; }
.bk-steps button { display: flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--on-dark-muted); padding: 8px 10px; min-height: 40px; background: none; border: 0; border-radius: 999px; }
.bk-steps button:disabled { cursor: default; }
.bk-steps button:not(:disabled):hover { color: var(--on-dark); background: rgba(196,164,106,.1); }
.bk-steps .n { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--on-dark-line); display: inline-grid; place-items: center; font-size: .74rem; font-weight: 700; flex: none; }
.bk-steps .n .icon { width: 13px; height: 13px; stroke-width: 2.4; }
.bk-steps .is-done .n { background: rgba(196,164,106,.2); border-color: var(--brass); color: var(--brass-soft); }
.bk-steps .is-current { color: #fff; }
.bk-steps .is-current .n { background: var(--brass); border-color: var(--brass); color: var(--ink); }
.bk-progress { display: none; flex: 1; min-width: 0; }
.bk-progress b { display: block; font-size: .94rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-progress small { color: var(--on-dark-muted); font-size: .8rem; }
.bk-progress .bar { height: 3px; background: rgba(196,164,106,.2); margin-top: 6px; }
.bk-progress .bar i { display: block; height: 100%; background: var(--brass); transition: width var(--fast); }
.bk-close { background: none; border: 1px solid var(--on-dark-line); color: var(--on-dark); width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.bk-close:disabled { opacity: .35; }
.bk-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.bk-body { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: clamp(24px, 4vw, 52px); padding-block: clamp(26px, 4vw, 48px) 56px; align-items: start; }
.bk-main { min-width: 0; }
.bk-main h2 { font: 500 clamp(2rem, 3.6vw, 2.9rem)/1.05 var(--f-display); margin: 0; text-wrap: balance; outline: none; }
.bk-main .hint { margin: 10px 0 0; color: var(--muted); max-width: 62ch; }
.bk-headrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.bk-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; }
.panel { background: var(--paper); border: 1px solid var(--line); }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; margin: 20px 0 0; font-size: .94rem; outline: none; }
.notice .icon { margin-top: 2px; }
.notice.err { background: var(--danger-bg); color: var(--danger); border: 1px solid #E5C4B8; }
.notice.info { background: #EEF0F4; color: var(--night-3); border: 1px solid #D5DAE4; }
.notice.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid #C6DACB; }
.field-err { color: var(--danger); font-size: .86rem; margin: 2px 0 0; display: flex; gap: 6px; align-items: flex-start; }
.field-err .icon { width: 16px; height: 16px; margin-top: 2px; }

.dates { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; margin-top: 24px; }
.date-btn { text-align: left; background: var(--paper); border: 1px solid var(--line); padding: 14px 18px; display: grid; gap: 4px; min-height: 76px; position: relative; }
.date-btn small { font: 700 .72rem/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.date-btn b { font: 600 1.45rem/1.15 var(--f-display); }
.date-btn[aria-pressed="true"] { border-color: var(--night); box-shadow: inset 0 -3px 0 var(--brass-deep), inset 0 0 0 1px var(--night); }
.date-btn[aria-pressed="true"] small { color: var(--brass-deep); }
.dates .nights { display: grid; place-items: center; padding: 0 14px; font-size: .86rem; font-weight: 700; color: var(--muted); text-align: center; white-space: nowrap; }
.mode-hint { margin: 14px 0 0; font-size: .94rem; color: var(--night-3); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.mode-hint .icon { color: var(--brass-deep); }
.cal-wrap { margin-top: 14px; padding: 18px 20px 16px; }
.cal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: relative; z-index: 1; }
.cal-head button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); display: inline-flex; align-items: center; justify-content: center; }
.cal-head button:disabled { opacity: .3; cursor: default; }
.cal-months { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; margin-top: -44px; }
.cal-month h3 { font: 600 1.3rem/44px var(--f-display); margin: 0 0 8px; text-align: center; text-transform: capitalize; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px 0; }
.cal-wd { font-size: .74rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-align: center; padding-bottom: 6px; }
.day { position: relative; border: 0; background: none; padding: 6px 0 5px; display: grid; justify-items: center; gap: 1px; min-height: 50px; font-variant-numeric: tabular-nums; color: var(--text); }
.day b { font-weight: 600; font-size: .98rem; }
.day small { font-size: .74rem; color: var(--muted); }
.day:hover:not(:disabled) { background: var(--stone); }
.day:disabled { color: #ADA79B; cursor: default; }
.day:disabled small { visibility: hidden; }
.day.is-demand small { color: var(--brass-deep); font-weight: 700; }
.day.is-full small { visibility: visible; color: var(--danger); font-weight: 700; }
.day.in-range { background: rgba(196,164,106,.2); }
.day.in-range:hover { background: rgba(196,164,106,.3); }
.day.is-start, .day.is-end { background: var(--night); color: #fff; }
.day.is-start:hover, .day.is-end:hover { background: var(--night-3); }
.day.is-start small, .day.is-end small { color: var(--brass-soft); }
.day.is-today b { text-decoration: underline; text-decoration-color: var(--brass-deep); text-underline-offset: 4px; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: .86rem; color: var(--muted); }
.cal-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); background: #fff; flex: none; }
.stepper button { width: 44px; height: 44px; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; }
.stepper button:hover:not(:disabled) { background: var(--stone); }
.stepper button:disabled { opacity: .3; cursor: default; }
.stepper output { min-width: 34px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.row-field { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 20px; margin-top: 22px; }
.row-field b { font: 600 1.3rem/1.15 var(--f-display); }
.row-field small { display: block; color: var(--muted); font-size: .88rem; }

.rt-list { display: grid; gap: 14px; margin-top: 14px; }
.rt { display: grid; grid-template-columns: 200px minmax(0, 1fr); }
.rt-img { position: relative; min-height: 100%; background: var(--stone); }
.rt-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.rt-body { padding: 18px 20px; display: grid; gap: 10px; }
.rt-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.rt-head > b { font: 600 1.55rem/1.05 var(--f-display); }
.rt-meta { color: var(--muted); font-size: .9rem; }
.rt-price { font-size: .9rem; color: var(--muted); }
.rt-price b { color: var(--text); font-family: var(--f-body); font-weight: 700; font-size: 1rem; font-variant-numeric: tabular-nums; }
.variant { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.variant:first-child { border-top: 0; }
.variant .pict { width: 48px; height: 40px; color: var(--night-3); }
.variant .pict .icon { width: 100%; height: 100%; stroke-width: 1.2; }
.variant b { display: block; font-size: 1rem; }
.tag { font-size: .84rem; font-weight: 700; color: var(--ok); }
.tag.low { color: var(--brass-deep); }
.tag.none { color: var(--danger); }
.alloc { margin-top: 18px; padding: 16px 20px; }
.alloc h3 { margin: 0 0 8px; font: 700 .74rem/1.2 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--brass-deep); }
.alloc ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: .94rem; }
.alloc li { display: flex; justify-content: space-between; gap: 12px; }
.alloc li span:last-child { color: var(--muted); white-space: nowrap; }
.cap { display: flex; align-items: flex-start; gap: 10px; margin: 12px 0 0; font-size: .96rem; font-weight: 600; outline: none; }
.cap.ok { color: var(--ok); }
.cap.bad { color: var(--danger); background: var(--danger-bg); border: 1px solid #E5C4B8; padding: 12px 14px; }

.rates { border: 0; margin: 24px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; min-width: 0; }
.choice { position: relative; display: block; cursor: pointer; }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.choice-body { display: grid; gap: 6px; height: 100%; border: 1px solid var(--line); background: var(--paper); padding: 18px 20px 18px 52px; position: relative; transition: border-color var(--fast), box-shadow var(--fast); }
.choice-body::before { content: ""; position: absolute; left: 18px; top: 21px; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted); background: #fff; }
.choice input:checked + .choice-body { border-color: var(--night); box-shadow: inset 0 0 0 1px var(--night); }
.choice input:checked + .choice-body::before { border-color: var(--night); background: radial-gradient(circle, var(--night) 0 5px, #fff 6px); }
.choice input:focus-visible + .choice-body { outline: 2px solid var(--brass-deep); outline-offset: 2px; }
.choice-body b { font-size: 1.04rem; }
.choice-body small { color: var(--muted); font-size: .9rem; }
.choice-price { font: 600 1.6rem/1.1 var(--f-display); }
.choice-price s { font-size: .9rem; color: var(--muted); margin-left: 8px; font-family: var(--f-body); font-weight: 500; }
.choice-mark { position: absolute; right: 16px; top: 18px; font: 700 .74rem/1 var(--f-body); letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); padding: 5px 8px; border-radius: 4px; background: #fff; }

.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 24px; padding: 22px; }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .88rem; font-weight: 600; color: var(--text); }
.field label .opt { color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid #CFC4B2; background: #fff; padding: 12px 14px; border-radius: 2px; min-height: 48px; }
.field input[readonly] { background: #F3F0EA; color: var(--muted); }
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--night); box-shadow: 0 0 0 3px rgba(15,26,46,.12); }
.field [aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: .94rem; cursor: pointer; font-weight: 500 !important; }
.check input { width: 22px; height: 22px; min-height: 0; margin: 1px 0 0; accent-color: var(--night); flex: none; }
.check.invalid { color: var(--danger); }
.example-note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 14px; }

.pay-list { border: 0; margin: 24px 0 0; padding: 0; display: grid; gap: 10px; min-width: 0; }
.pay-detail { padding: 16px 18px; margin-top: -2px; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; border-top: 0; }
.pay-detail .head { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: .9rem; color: var(--muted); }
.pay-detail.text { display: block; color: var(--muted); font-size: .94rem; }
.secure { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: .92rem; color: var(--muted); }
.secure .icon { color: var(--ok); margin-top: 2px; }
.pay-cta { margin-top: 22px; width: 100%; min-height: 58px; font-size: .9rem; }

.bk-aside { position: sticky; top: 24px; min-width: 0; }
.sum { padding: 22px; }
.sum h3 { font: 700 .74rem/1.2 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--brass-deep); margin: 0 0 14px; }
.sum-dates { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.sum-dates small { display: block; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.sum-dates b { font: 600 1.15rem/1.2 var(--f-display); }
.sum-dates .arrow { color: var(--brass-deep); }
.sum-meta { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: .94rem; font-weight: 600; }
.sum-lines { list-style: none; margin: 0; padding: 12px 0; display: grid; gap: 10px; border-bottom: 1px solid var(--line); font-size: .94rem; }
.sum-lines li { display: flex; justify-content: space-between; gap: 12px; }
.sum-lines li > span:first-child { min-width: 0; }
.sum-lines li > span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.sum-lines small { display: block; color: var(--muted); font-size: .84rem; }
.sum-lines .disc { color: var(--ok); }
.sum-lines .muted { color: var(--muted); }
.sum-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 14px; }
.sum-total span { font-weight: 700; }
.sum-total b { font: 600 2rem/1 var(--f-display); }
.sum-vat { font-size: .84rem; color: var(--muted); text-align: right; margin-top: 4px; }
.sum-perks { margin-top: 14px; display: grid; gap: 8px; font-size: .88rem; color: var(--muted); padding: 0 4px; }
.sum-perks span { display: flex; gap: 8px; align-items: center; }
.sum-perks .icon { color: var(--ok); width: 16px; height: 16px; }
.bk-foot { display: none; flex: none; background: var(--paper); border-top: 1px solid var(--line); padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom, 0px)); align-items: center; justify-content: space-between; gap: 12px; }
.bk-foot .tot { background: none; border: 0; padding: 4px 0; text-align: left; min-height: 44px; min-width: 0; }
.bk-foot .tot b { display: block; font: 600 1.5rem/1 var(--f-display); }
.bk-foot .tot small { display: block; color: var(--muted); font-size: .8rem; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.bk-foot .btn { min-height: 48px; padding: 0 14px; font-size: .78rem; letter-spacing: .04em; }

.processing { padding: 70px 10px; display: grid; justify-items: center; gap: 22px; text-align: center; }
.proc-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; text-align: left; }
.proc-list li { display: flex; align-items: center; gap: 12px; color: var(--muted); font-weight: 600; }
.proc-list .dot { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; }
.proc-list li.active { color: var(--text); }
.proc-list li.active .dot { border-color: var(--brass-deep); border-top-color: transparent; animation: spin .8s linear infinite; }
.proc-list li.done { color: var(--ok); }
.proc-list li.done .dot { border-color: var(--ok); background: var(--ok); color: #fff; }
.proc-list .dot .icon { width: 14px; height: 14px; stroke-width: 2.4; }
@keyframes spin { to { transform: rotate(360deg); } }

.done { max-width: 880px; margin-inline: auto; padding-block: clamp(30px, 5vw, 60px) 64px; }
.done-head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
.done-mark { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--brass-deep); display: grid; place-items: center; color: var(--brass-deep); flex: none; }
.done-mark .icon { width: 30px; height: 30px; stroke-width: 1.5; }
.done-mark.cxl { border-color: var(--danger); color: var(--danger); }
.done h2 { font: 500 clamp(2.3rem, 5vw, 3.6rem)/1.02 var(--f-display); margin: 18px 0 0; outline: none; }
.done h2 em { color: var(--brass-deep); font-style: italic; font-weight: 500; }
.ticket { margin-top: 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ticket > div { padding: 16px 18px; border-right: 1px dashed var(--line); min-width: 0; }
.ticket > div:last-child { border-right: 0; }
.ticket small { display: block; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.ticket b { font: 600 1.25rem/1.25 var(--f-display); overflow-wrap: anywhere; }
.ticket .sub { display: block; font-size: .86rem; color: var(--muted); margin-top: 2px; }
.done-rooms { margin-top: 14px; padding: 6px 18px; }
.done-rooms ul { list-style: none; margin: 0; padding: 0; }
.done-rooms li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.done-rooms li:last-child { border-bottom: 0; }
.done-rooms span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.done-docs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.demo-box { margin-top: 28px; border: 1px dashed var(--brass-deep); background: rgba(196,164,106,.08); padding: 18px 20px; display: grid; gap: 12px; }
.demo-box p { margin: 0; font-size: .94rem; color: var(--text); }
.demo-box .row { display: flex; flex-wrap: wrap; gap: 10px; }

/* Documents */
.doc { background: #fff; position: relative; overflow: hidden; }
.doc::before { content: attr(data-mark); position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%) rotate(-24deg); font: 800 clamp(3rem, 12vw, 7rem)/1 var(--f-body); letter-spacing: .1em; color: rgba(154, 63, 40, .07); white-space: nowrap; pointer-events: none; }
.doc-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 16px; border-bottom: 2px solid var(--night); padding-right: 40px; }
.doc-head .logo { color: var(--night); }
.doc-head .logo-text small { color: var(--muted); }
.doc-meta { text-align: right; font-size: .88rem; color: var(--muted); }
.doc-meta b { display: block; font: 600 1.3rem/1.2 var(--f-display); color: var(--text); }
.doc table { width: 100%; border-collapse: collapse; font-size: .92rem; margin-top: 10px; }
.doc th { text-align: left; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--line); }
.doc td { padding: 9px 6px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.doc td.num, .doc th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.doc tfoot td { border-bottom: 0; }
.doc tfoot tr.grand td { font-weight: 800; font-size: 1rem; border-top: 2px solid var(--night); }
.doc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 18px; font-size: .92rem; }
.doc-grid h5 { margin: 0 0 4px; font: 700 .72rem/1.2 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--brass-deep); }
.doc-grid p { margin: 0; color: var(--text); }
.doc-note { margin-top: 16px; font-size: .88rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ============ Admin ============ */
.ad { position: fixed; top: var(--demo-h); left: 0; right: 0; bottom: 0; z-index: 90; background: #EFEBE3; color: var(--text); display: flex; flex-direction: column; }
.ad-top { background: var(--ink); color: var(--on-dark); flex: none; }
.ad-top .wrap { max-width: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; min-height: 62px; padding-block: 8px; }
.ad-title { font: 600 1.3rem/1 var(--f-display); color: var(--brass-soft); padding-left: 16px; border-left: 1px solid var(--on-dark-line); outline: none; margin: 0; }
.ad-top .spacer { flex: 1; }
.ad-date { font-size: .88rem; color: var(--on-dark-muted); }
.ad-scroll { flex: 1; overflow-y: auto; }
.ad-wrap { max-width: 1480px; padding-block: 22px 60px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { text-align: left; background: var(--paper); border: 1px solid var(--line); padding: 16px 18px; display: grid; gap: 4px; align-content: start; transition: border-color var(--fast); }
.kpi:hover { border-color: var(--brass-deep); }
.kpi small { font-size: .76rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.kpi b { font: 600 2.2rem/1.05 var(--f-display); }
.kpi b span { font-size: .55em; color: var(--muted); }
.kpi .sub { font-size: .86rem; color: var(--muted); }
.kpi.accent { border-color: var(--brass); background: #FBF4E6; }
.kpi.accent .sub { color: var(--brass-deep); font-weight: 700; }
.kpi-bar { height: 4px; background: var(--stone); overflow: hidden; margin-top: 6px; }
.kpi-bar i { display: block; height: 100%; background: var(--brass-deep); }
.today { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.today .panel { padding: 14px 18px; }
.today h3 { margin: 0 0 6px; font: 700 .76rem/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--brass-deep); display: flex; align-items: center; gap: 8px; }
.today ul { list-style: none; margin: 0; padding: 0; }
.today li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line-soft); }
.today li:first-child { border-top: 0; }
.today .who { background: none; border: 0; padding: 4px 0; text-align: left; min-width: 0; min-height: 44px; }
.today .who b { display: block; font-size: .98rem; }
.today .who span { font-size: .86rem; color: var(--muted); }
.today .empty { color: var(--muted); font-size: .92rem; padding: 6px 0; margin: 0; }
.ad-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
.tabs { display: inline-flex; border: 1px solid var(--line); background: var(--paper); max-width: 100%; overflow-x: auto; }
.tabs button { border: 0; background: none; min-height: 44px; padding: 0 18px; font-size: .92rem; font-weight: 700; white-space: nowrap; }
.tabs button + button { border-left: 1px solid var(--line); }
.tabs button[aria-selected="true"] { background: var(--night); color: var(--on-dark); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
.search { position: relative; flex: 1 1 240px; max-width: 420px; }
.search .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; }
.search input { width: 100%; min-height: 44px; border: 1px solid #CFC4B2; background: #fff; padding: 0 12px 0 38px; border-radius: 2px; }
.search input:focus { outline: none; border-color: var(--night); box-shadow: 0 0 0 3px rgba(15,26,46,.12); }
.select { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 600; }
.select select { min-height: 44px; border: 1px solid #CFC4B2; background: #fff; padding: 0 10px; border-radius: 2px; }
.period-nav { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.period-nav button { min-width: 44px; min-height: 44px; border: 1px solid var(--line); background: var(--paper); display: inline-flex; align-items: center; justify-content: center; padding: 0 12px; font-weight: 700; font-size: .86rem; }
.period-nav button:hover { border-color: var(--brass-deep); }
.period-label { font: 600 1.15rem/1.2 var(--f-display); padding: 0 6px; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: .86rem; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 18px; height: 11px; display: inline-block; border-radius: 2px; }
.legend .icon { width: 15px; height: 15px; }
.legend strong { color: var(--text); }
.tl-box { margin-top: 10px; background: var(--paper); border: 1px solid var(--line); overflow-x: auto; position: relative; }
.tl { --cw: 48px; --lw: 136px; position: relative; width: max-content; min-width: 100%; }
.tl-head, .tl-row { display: flex; }
.tl-head { border-bottom: 1px solid var(--line); }
.tl-corner, .tl-room { width: var(--lw); flex: none; position: sticky; left: 0; z-index: 3; background: var(--paper); border-right: 1px solid var(--line); }
.tl-corner { font-size: .76rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; display: flex; align-items: flex-end; }
.tl-day { width: var(--cw); flex: none; text-align: center; padding: 16px 0 6px; font-variant-numeric: tabular-nums; position: relative; }
.tl-day span { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
.tl-day b { font-size: 1rem; font-weight: 700; display: inline-grid; place-items: center; width: 28px; height: 28px; }
.tl-day.is-we { background: rgba(15,26,46,.035); }
.tl-day.is-today b { color: var(--paper); background: var(--night); border-radius: 50%; }
.tl-day.is-demand::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--brass-deep); }
.tl-day .mon { position: absolute; left: 0; right: 0; top: 3px; font-size: .66rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--brass-deep); }
.tl-row { border-bottom: 1px solid var(--line-soft); }
.tl-row:last-child { border-bottom: 0; }
.tl-room { padding: 8px 14px; display: grid; align-content: center; }
.tl-room b { font-size: .94rem; }
.tl-room small { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.tl-room small .icon { width: 15px; height: 15px; }
.tl-track { position: relative; height: 54px; flex: none; background-image: repeating-linear-gradient(90deg, transparent 0 calc(var(--cw) - 1px), #EEE8DE calc(var(--cw) - 1px) var(--cw)); }
.tl-col { position: absolute; top: 0; bottom: 0; width: var(--cw); pointer-events: none; }
.tl-col.we { background: rgba(15,26,46,.03); }
.tl-col.today { background: rgba(196,164,106,.14); }
.bar { position: absolute; top: 8px; height: 38px; border: 0; border-radius: 3px; padding: 0 9px; display: flex; align-items: center; gap: 6px; font-size: .84rem; font-weight: 700; text-align: left; white-space: nowrap; overflow: hidden; z-index: 1; transition: transform var(--fast), box-shadow var(--fast), opacity var(--fast); }
.bar:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(15,26,46,.2); }
.bar small { font-weight: 600; opacity: .8; font-size: .76rem; }
.bar .grp { display: inline-flex; align-items: center; gap: 3px; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,.18); font-size: .72rem; }
.bar .grp .icon { width: 12px; height: 12px; }
.bar.st-in { background: #DCE9DF; color: #1F4029; box-shadow: inset 3px 0 0 var(--ok); }
.bar.st-in .grp { background: rgba(31,64,41,.1); }
.bar.st-conf { background: var(--night-3); color: #F1EEE8; }
.bar.st-out { background: #E3DFD7; color: #585D69; }
.bar.st-out .grp { background: rgba(0,0,0,.06); }
.bar.is-new { background: var(--brass); color: var(--ink); box-shadow: none; }
.bar.is-new .grp { background: rgba(10,17,32,.12); }
.bar.block { background: repeating-linear-gradient(135deg, #E2DDD3 0 6px, #D5CEC1 6px 12px); color: #3F4655; }
.bar.is-focus { outline: 3px solid var(--brass-deep); outline-offset: 1px; z-index: 2; }
.bar.is-sib { outline: 2px dashed var(--brass-deep); outline-offset: 1px; }
.bar.dim { opacity: .22; }
.bar.pulse { animation: glow .9s ease-in-out 3; }
@keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(196,164,106,.45); } }
.legend .st-in { background: #DCE9DF; box-shadow: inset 3px 0 0 var(--ok); }
.legend .st-conf { background: var(--night-3); }
.legend .st-new { background: var(--brass); }
.legend .st-out { background: #E3DFD7; }
.legend .st-block { background: repeating-linear-gradient(135deg, #E2DDD3 0 4px, #D5CEC1 4px 8px); }
.legend .st-demand { width: 7px; height: 7px; border-radius: 50%; background: var(--brass-deep); }
.table-box { margin-top: 10px; background: var(--paper); border: 1px solid var(--line); overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: .92rem; }
.list th { text-align: left; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.list td { padding: 10px 14px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; font-variant-numeric: tabular-nums; vertical-align: middle; }
.list tbody tr { cursor: pointer; }
.list tbody tr:hover { background: #F6F2EA; }
.list tbody tr.is-new { background: #FBF4E6; }
.list .ref { background: none; border: 0; padding: 6px 0; font-weight: 700; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; min-height: 44px; }
.list .sub { display: block; font-size: .84rem; color: var(--muted); }
.list tfoot td { font-weight: 700; border-bottom: 0; }
.rchips { display: flex; gap: 4px; flex-wrap: wrap; }
.rchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border: 1px solid var(--line); border-radius: 4px; font-size: .82rem; font-weight: 700; background: #fff; }
.rchip .icon { width: 14px; height: 14px; }
.status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.status.st-in { background: #DCE9DF; color: #1F4029; }
.status.st-conf { background: #E2E6EE; color: var(--night-3); }
.status.st-out { background: #ECE8E1; color: #4F5460; }
.status.st-cxl { background: var(--danger-bg); color: var(--danger); }
.status.st-new { background: #F2E6CC; color: #5F4518; }
.status.st-block { background: #E7E2D9; color: #3F4655; }
.status.pay-paid { background: #DCE9DF; color: #1F4029; }
.status.pay-open { background: #F2E6CC; color: #5F4518; }
.status.pay-refunded, .status.pay-kept { background: #ECE8E1; color: #4F5460; }
.empty-state { padding: 34px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.prices { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; margin-top: 14px; align-items: start; }
.prices .panel { padding: 22px; }
.prices h3 { margin: 22px 0 0; font: 700 .76rem/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--brass-deep); }
.price-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.price-row label { font-size: .96rem; }
.unit-input { display: inline-flex; align-items: center; border: 1px solid #CFC4B2; background: #fff; flex: none; }
.unit-input input { width: 84px; min-height: 44px; border: 0; padding: 0 10px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; background: transparent; }
.unit-input input[type="time"] { width: 120px; text-align: left; }
.unit-input span { padding: 0 12px 0 2px; color: var(--muted); font-size: .88rem; }
.unit-input span:empty { display: none; }
.preview-site { background: var(--night); color: var(--on-dark); padding: 22px; }
.preview-site h4 { margin: 0; font: 700 .76rem/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--brass); }
.preview-site ul { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 12px; }
.preview-site li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid rgba(196,164,106,.2); padding-bottom: 12px; }
.preview-site li b { font: 600 1.7rem/1 var(--f-display); }
.preview-site p { color: var(--on-dark-muted); font-size: .88rem; margin: 14px 0 0; }
.drawer-head { padding: 20px 64px 18px 24px; background: var(--night); color: var(--on-dark); display: grid; gap: 8px; position: relative; }
.drawer-head .x-btn { background: rgba(255,255,255,.1); color: var(--on-dark); }
.drawer-head h3 { font: 600 1.9rem/1.05 var(--f-display); margin: 0; }
.drawer-head .pills { display: flex; flex-wrap: wrap; gap: 6px; }
.drawer-head .meta { color: var(--on-dark-muted); font-size: .9rem; }
.drawer-body { padding: 18px 24px; overflow-y: auto; overscroll-behavior: contain; flex: 1; min-height: 0; }
.dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 18px; margin: 0; font-size: .94rem; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.d-contact { margin: 0; font-size: .94rem; line-height: 1.55; overflow-wrap: anywhere; }
.drawer-body h4 { margin: 20px 0 8px; font: 700 .76rem/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--brass-deep); }
.d-rooms { width: 100%; border-collapse: collapse; font-size: .92rem; }
.d-rooms td, .d-rooms th { padding: 8px 4px; border-bottom: 1px solid var(--line-soft); text-align: left; }
.d-rooms th { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.d-rooms .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.d-rooms tfoot td { border-bottom: 0; }
.d-rooms tfoot .grand td { font-weight: 800; border-top: 2px solid var(--night); }
.drawer-actions { padding: 14px 24px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: grid; gap: 8px; background: var(--paper); }
.drawer-actions .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.confirm-box { margin-top: 18px; padding: 16px; border: 1px solid #E5C4B8; background: var(--danger-bg); display: grid; gap: 10px; outline: none; }
.confirm-box b { color: var(--danger); font-size: 1.02rem; }
.confirm-box p { margin: 0; font-size: .92rem; }
.confirm-box .row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Lining figures for data set in the display face (after all font shorthands) */
.price-main b, .sum-total b, .kpi b, .ticket b, .preview-site li b, .choice-price, .date-btn b, .sum-dates b, .period strong, .sb-value, .bk-foot .tot b, .mcta b, .doc-meta b, .period-label, .cal-month h3, .contact-line .value, .address-card address b { font-variant-numeric: lining-nums tabular-nums; }

/* Responsive */
@media (max-width: 1100px) {
  .main-nav { display: none; }
  .menu-btn { display: inline-flex; }
  .header-tools { margin-left: auto; }
  .aud-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bk-body { grid-template-columns: minmax(0, 1fr); }
  .bk-aside { position: static; }
  .bk-steps { display: none; }
  .bk-progress { display: block; }
  .prices { grid-template-columns: minmax(0, 1fr); }
  .demobar .note { display: none; }
}
@media (max-width: 860px) {
  .section-head { grid-template-columns: minmax(0, 1fr); }
  .room-row, .room-row.flip, .morning-grid, .loc-grid, .faq-grid { grid-template-columns: minmax(0, 1fr); }
  .room-row.flip .gallery { order: 0; }
  .facts-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fact { padding: 20px 12px 20px 0; border-left: 0; gap: 10px; }
  .fact:nth-child(even) { padding-left: 16px; border-left: 1px solid rgba(196,164,106,.16); }
  .fact:nth-child(n+3) { border-top: 1px solid rgba(196,164,106,.16); }
  .fact b { font-size: 1.12rem; }
  .fact .icon { width: 24px; height: 24px; }
  .contact-copy { max-width: none; padding-top: 28px; }
  .contact-media { position: relative; width: auto; min-height: 280px; margin-inline: calc(var(--gutter) * -1); order: -1; }
  .contact-media::before { background: linear-gradient(0deg, var(--night) 0%, rgba(15,26,46,0) 60%); }
  .footer-grid { grid-template-columns: minmax(0, 1fr); }
  .footer-links { justify-content: flex-start; }
  .mcta { display: flex; }
  .hero-media { bottom: auto; height: min(70vh, 560px); }
  .hero-media img { object-position: 64% 40%; }
  .hero-media::after { background: linear-gradient(180deg, rgba(10,17,32,.5) 0%, rgba(10,17,32,.62) 34%, rgba(10,17,32,.9) 72%, var(--ink) 100%); }
  .hero-inner { min-height: 0; padding-top: calc(var(--header-h) + clamp(56px, 10vh, 150px)); }
  .searchbar { margin-top: 24px; }
  .hero h1 { line-height: .98; }
  .searchbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sb-field:nth-child(2) { border-right: 0; }
  .sb-field:nth-child(3) { grid-column: 1 / -1; border-right: 0; border-top: 1px solid rgba(196,164,106,.22); display: flex; align-items: center; justify-content: space-between; min-height: 64px; }
  .searchbar > .btn { grid-column: 1 / -1; min-height: 56px; }
  .period .btn { margin-left: 0; }
  .cal-months { grid-template-columns: minmax(0, 1fr); }
  .cal-months .cal-month + .cal-month { display: none; }
  .rt { grid-template-columns: minmax(0, 1fr); }
  .rt-img { aspect-ratio: 16 / 7; }
  .bk-foot { display: flex; }
  .bk-nav .next { display: none; }
  .ticket { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ticket > div:nth-child(2) { border-right: 0; }
  .ticket > div:nth-child(-n+2) { border-bottom: 1px dashed var(--line); }
  .clock { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .today { grid-template-columns: minmax(0, 1fr); }
  .doc-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .demobar .wrap { gap: 8px; padding-inline: 10px; }
  .demobar nav button { padding: 0 10px; }
  .demobar nav .lbl-long { display: none; }
  .header-book { display: none; }
  .site-header .logo-text small { display: none; }
  .hero-inner { padding-top: calc(var(--header-h) + clamp(20px, 4.5vh, 60px)); }
  .hero h1 { font-size: clamp(2.8rem, 13.4vw, 3.4rem); }
  .hero .lead { margin-top: 14px; }
  .sb-field { min-height: 64px; padding: 10px 16px; }
  .sb-field:nth-child(3) { min-height: 58px; }
  .aud-grid { grid-template-columns: minmax(0, 1fr); }
  .form { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  .rates { grid-template-columns: minmax(0, 1fr); }
  .pay-detail { grid-template-columns: 1fr 1fr; }
  .pay-detail .field:first-of-type { grid-column: 1 / -1; }
  .dates { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .dates .nights { grid-column: 1 / -1; grid-row: 2; padding: 8px 0 0; }
  .date-btn { padding: 12px 14px; }
  .date-btn b { font-size: 1.22rem; }
  .cal-wrap { padding: 12px 8px; }
  .kpi b { font-size: 1.8rem; }
  .tl { --cw: 42px; --lw: 96px; }
  .tl-room small span { display: none; }
  .ad-top .logo-text, .ad-top .demo-pill, .ad-date { display: none; }
  .ad-title { border-left: 0; padding-left: 0; }
  .ad-bar .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; overflow: visible; }
  .tabs button { white-space: normal; line-height: 1.2; padding: 6px 8px; min-height: 52px; font-size: .86rem; }
  .tabs button + button { border-left: 1px solid var(--line); }
  .ad-bar > .btn { width: 100%; }
  .dist li { grid-template-columns: 24px minmax(0, 1fr); }
  .dist em { grid-column: 2; text-align: left; }
  .drawer-actions .row { grid-template-columns: minmax(0, 1fr); }
  .layer-drawer .layer-card { display: block; overflow-y: auto; overscroll-behavior: contain; }
  .layer-drawer .drawer-head .x-btn { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; background: var(--night); color: var(--on-dark); box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .drawer-body { overflow: visible; }
  .bk-top .logo-text { display: none; }
  .bk-top .wrap { gap: 10px; }
  .variant { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; }
  .variant .pict { width: 40px; height: 34px; }
  .thumbs button { max-width: none; }
  .choice-mark { position: static; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}
</style>

const layers = [];
const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
function openLayer({ html, kind = 'modal', label = '', cls = '', onClose, focus }) {
  const prev = document.activeElement;
  const wrap = document.createElement('div');
  wrap.className = `layer layer-${kind}`;
  wrap.innerHTML = `<div class="layer-backdrop" data-act="layer-close"></div><div class="layer-card ${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}" tabindex="-1">${html}</div>`;

  layers.push(entry);
  syncInert();
  const target = (focus && wrap.querySelector(focus)) || wrap.querySelector('.layer-card');
  target.focus();
  return entry;
}
function closeLayer(entry = layers[layers.length - 1], restore = true) {
  if (!entry) return;
  const i = layers.indexOf(entry);
  if (i < 0) return;
  layers.splice(i, 1);
  entry.wrap.remove();
  syncInert();
  if (entry.onClose) entry.onClose();
  if (restore && entry.prev && entry.prev.isConnected && !entry.prev.closest('[inert]')) entry.prev.focus();
}
const topLayer = () => layers[layers.length - 1];
function syncInert() {
  const modal = layers.length > 0;
  const siteHidden = BK.open || UI.view === 'admin';
  $('#site-root').inert = modal || siteHidden;
  $('#bk').inert = modal;
  $('#ad').inert = modal || BK.open;

  $('#presenter').inert = modal;
  document.documentElement.classList.toggle('lock', modal || siteHidden);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    const top = topLayer();
    const box = top ? top.wrap.querySelector('.layer-card') : null;
    if (!box) return;
    const items = $$(FOCUSABLE, box).filter(el => el.offsetParent !== null);
    if (!items.length) { e.preventDefault(); box.focus(); return; }
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === box)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (e.key === 'Escape') {
    const top = topLayer();
    if (top) { if (top === simEntry) { simResult('cancel'); return; } if (!top.locked) closeLayer(top); return; }

let toastTimer;
function toast(msg, action) {
  const el = $('#toast');
  el.querySelector('span').textContent = msg;
  const old = el.querySelector('button');
  if (old) old.remove();
  if (action) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = action.label;
    b.addEventListener('click', () => { el.classList.remove('show'); action.fn(); });
    el.append(b);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), action ? 7000 : 3800);
}

/* Uhr: 22:00 oben, 07:00 unten */
function updateClock() {
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  const m = Math.round((22 * 60 + p * 9 * 60) / 5) * 5 % 1440;
  const night = m >= 22 * 60 || m < 5 * 60 + 30;
  $('#clock').innerHTML = `${icon(night ? 'moon' : m < 6 * 60 + 30 ? 'sunrise' : 'sun')}<span>${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}</span>`;
}

addEventListener('scroll', () => {

    ticking = false;

const STEP_KEYS = ['bk.s1', 'bk.s2', 'bk.s3', 'bk.s4', 'bk.s5'];
const roomCount = () => BK.qty.EZ + BK.qty.DZD + BK.qty.DZT;
const capacity = () => BK.qty.EZ + (BK.qty.DZD + BK.qty.DZT) * 2;
function draftRooms() {
  const rooms = [];
  for (const kind of KINDS) for (let i = 0; i < BK.qty[kind]; i++) rooms.push({ kind, guests: 0 });
  let left = BK.guests;
  rooms.forEach(r => { if (left > 0) { r.guests = 1; left--; } });
  rooms.forEach(r => { if (left > 0 && capOf(r.kind) > 1) { r.guests++; left--; } });
  return { rooms, unplaced: left };
}
function quote(rate = BK.rate) {
  const { rooms, unplaced } = draftRooms();
  const priced = priceRooms(rooms, BK.from, BK.to, rate);
  const total = sumOf(priced, 'total');
  return { n: BK.to - BK.from, rooms: priced, unplaced, sub: sumOf(priced, 'sub'), long: sumOf(priced, 'long'), saver: sumOf(priced, 'saver'), total, vat: round2(total - total / 1.07) };
}
function clampQty() {
  let changed = false;
  for (const kind of KINDS) {
    const max = freeRooms(kind, BK.from, BK.to).length;
    if (BK.qty[kind] > max) { BK.qty[kind] = max; changed = true; }
  }
  if (changed) BK.clamped = true;
}

}

function validate(step) {
  const errors = {};

  if (step === 2) {
    const n = roomCount(), cap = capacity();
    if (!n) errors.rooms = t('bk.err.rooms0');
    else if (KINDS.some(k => BK.qty[k] > freeRooms(k, BK.from, BK.to).length)) errors.rooms = t('bk.err.avail');
    else if (cap < BK.guests) errors.rooms = t('bk.err.cap', { m: guestsL(BK.guests - cap) });
    else if (n > BK.guests) errors.rooms = t('bk.err.toomany');
    else {
      const { rooms, unplaced } = draftRooms();
      const placed = rooms.reduce((a, r) => a + r.guests, 0);

function simResult(kind) {

  const entry = simEntry;

    BK.paying = true;
    entry.wrap.querySelectorAll('button').forEach(b => { b.disabled = true; });

/* Each payment run gets an id; resetDemo() bumps it so timers of an older run end without effect. */
let payRun = 0, payTimer = 0;
function cancelProcessing() {
  payRun += 1;
  clearTimeout(payTimer);
}
function runProcessing() {
  const run = ++payRun;
  BK.processing = 1;
  renderBooking({ focus: 'heading' });
  const tick = () => {
    if (run !== payRun) return;
    if (BK.processing < 3) { BK.processing += 1; renderBooking(); payTimer = setTimeout(tick, 520); return; }
    const b = createBooking();
    BK.processing = 0;
    BK.paying = false;
    if (!b) {
      const fail = firstInvalid(5);
      if (fail) showInvalid(fail);
      else { clampQty(); BK.step = 2; BK.clamped = true; renderBooking({ focus: 'heading' }); }
      toast(t(fail && fail.step !== 2 ? 'bk.p.invalid' : 'bk.p.gone'));
      return;
    }
    BK.doneRef = b.ref;
    BK.step = 6;
    S.pres.s1 = S.pres.s2 = S.pres.s3 = true;
    save();
    renderBooking({ focus: 'heading' });
    $('#bk-scroll').scrollTop = 0;
    renderSite();
    renderPresenter();
  };
  payTimer = setTimeout(tick, 520);
}
function createBooking() {
  if (firstInvalid(5)) return null;
  const q = quote();
  if (!q.rooms.length || q.unplaced || q.rooms.reduce((a, r) => a + r.guests, 0) !== BK.guests) return null;
  const used = [];
  for (const r of q.rooms) {
    const free = freeRooms(r.kind, BK.from, BK.to).filter(i => !used.includes(i));
    if (!free.length) return null;
    r.room = free[0];
    used.push(free[0]);
  }
  const f = BK.form;
  const b = {
    ref: newRef(), from: BK.from, to: BK.to, rate: BK.rate, pay: BK.pay, channel: 'web', status: 'conf', payStatus: 'paid',
    guest: { first: f.first.trim(), last: f.last.trim(), email: f.email.trim(), phone: f.phone.trim(), company: f.company.trim() },
    guests: BK.guests,
    rooms: q.rooms.map(r => ({ room: r.room, kind: r.kind, guests: r.guests, sub: r.sub, long: r.long, saver: r.saver, total: r.total })),
    sub: q.sub, long: q.long, saver: q.saver, total: q.total,
    cond: { freeH: S.rules.freeH }, times: { ...S.times }, arrival: f.arrival, notes: f.notes.trim(),
    created: Date.now(), isNew: true, refund: 0
  };
  S.bookings.push(b);
  S.lastNew = b.ref;
  save();
  return b;
}
